<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bg-inst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d2447"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0047AB"/>
      <stop offset="100%" style="stop-color:#1a6fd4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg-inst)"/>

  <!-- Subtle dot grid -->
  <g fill="#0047AB" opacity="0.08">
    <circle cx="100" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="300" cy="100" r="2"/>
    <circle cx="400" cy="100" r="2"/><circle cx="500" cy="100" r="2"/><circle cx="600" cy="100" r="2"/>
    <circle cx="700" cy="100" r="2"/><circle cx="800" cy="100" r="2"/><circle cx="900" cy="100" r="2"/>
    <circle cx="1000" cy="100" r="2"/><circle cx="1100" cy="100" r="2"/>
    <circle cx="100" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="300" cy="200" r="2"/>
    <circle cx="400" cy="200" r="2"/><circle cx="500" cy="200" r="2"/><circle cx="600" cy="200" r="2"/>
    <circle cx="700" cy="200" r="2"/><circle cx="800" cy="200" r="2"/><circle cx="900" cy="200" r="2"/>
    <circle cx="1000" cy="200" r="2"/><circle cx="1100" cy="200" r="2"/>
    <circle cx="100" cy="300" r="2"/><circle cx="200" cy="300" r="2"/><circle cx="300" cy="300" r="2"/>
    <circle cx="400" cy="300" r="2"/><circle cx="500" cy="300" r="2"/><circle cx="600" cy="300" r="2"/>
    <circle cx="700" cy="300" r="2"/><circle cx="800" cy="300" r="2"/><circle cx="900" cy="300" r="2"/>
    <circle cx="1000" cy="300" r="2"/><circle cx="1100" cy="300" r="2"/>
    <circle cx="100" cy="400" r="2"/><circle cx="200" cy="400" r="2"/><circle cx="300" cy="400" r="2"/>
    <circle cx="400" cy="400" r="2"/><circle cx="500" cy="400" r="2"/><circle cx="600" cy="400" r="2"/>
    <circle cx="700" cy="400" r="2"/><circle cx="800" cy="400" r="2"/><circle cx="900" cy="400" r="2"/>
    <circle cx="1000" cy="400" r="2"/><circle cx="1100" cy="400" r="2"/>
    <circle cx="100" cy="500" r="2"/><circle cx="200" cy="500" r="2"/><circle cx="300" cy="500" r="2"/>
    <circle cx="400" cy="500" r="2"/><circle cx="500" cy="500" r="2"/><circle cx="600" cy="500" r="2"/>
    <circle cx="700" cy="500" r="2"/><circle cx="800" cy="500" r="2"/><circle cx="900" cy="500" r="2"/>
    <circle cx="1000" cy="500" r="2"/><circle cx="1100" cy="500" r="2"/>
  </g>

  <!-- Browser mockup -->
  <rect x="60" y="60" width="1080" height="480" rx="10" fill="#0d1e3d" stroke="#0047AB" stroke-width="1.5"/>

  <!-- Browser chrome bar -->
  <rect x="60" y="60" width="1080" height="44" rx="10" fill="#0a1628"/>
  <rect x="60" y="84" width="1080" height="20" fill="#0a1628"/>
  <!-- Traffic lights -->
  <circle cx="90" cy="82" r="7" fill="#e74c3c"/>
  <circle cx="114" cy="82" r="7" fill="#f39c12"/>
  <circle cx="138" cy="82" r="7" fill="#2ecc71"/>
  <!-- Address bar -->
  <rect x="200" y="70" width="660" height="24" rx="12" fill="#0d2447" stroke="#0047AB" stroke-width="1" opacity="0.8"/>
  <text x="530" y="86" text-anchor="middle" fill="#4a8fd4" font-family="monospace" font-size="12">institutoprivadotucuman.edu.ar</text>

  <!-- Site header -->
  <rect x="60" y="104" width="1080" height="80" fill="url(#header-grad)"/>
  <!-- Logo area -->
  <rect x="90" y="118" width="44" height="44" rx="22" fill="white" opacity="0.15"/>
  <text x="112" y="146" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">IP</text>
  <text x="148" y="136" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">Instituto Privado Tucumán</text>
  <text x="148" y="155" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-size="12">Excelencia educativa desde 1987</text>
  <!-- Nav items -->
  <text x="700" y="145" fill="white" font-family="sans-serif" font-size="13">Inicio</text>
  <text x="760" y="145" fill="rgba(255,255,255,0.75)" font-family="sans-serif" font-size="13">Nosotros</text>
  <text x="840" y="145" fill="rgba(255,255,255,0.75)" font-family="sans-serif" font-size="13">Carreras</text>
  <text x="920" y="145" fill="rgba(255,255,255,0.75)" font-family="sans-serif" font-size="13">Contacto</text>
  <rect x="1010" y="130" width="100" height="30" rx="15" fill="white" opacity="0.2"/>
  <text x="1060" y="150" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">Inscribirse</text>

  <!-- Hero section -->
  <rect x="60" y="184" width="1080" height="200" fill="#0d2447" opacity="0.6"/>
  <!-- Hero text -->
  <text x="120" y="250" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">Formando profesionales</text>
  <text x="120" y="285" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">del futuro</text>
  <text x="120" y="315" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="15">Educación de calidad, tecnología e innovación</text>
  <rect x="120" y="335" width="140" height="34" rx="17" fill="#0047AB"/>
  <text x="190" y="357" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">Ver carreras</text>
  <rect x="272" y="335" width="130" height="34" rx="17" fill="transparent" stroke="white" stroke-width="1.5"/>
  <text x="337" y="357" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13">Contactanos</text>

  <!-- Decorative circle right -->
  <circle cx="960" cy="280" r="80" fill="#0047AB" opacity="0.1"/>
  <circle cx="960" cy="280" r="55" fill="#0047AB" opacity="0.15"/>
  <text x="960" y="270" text-anchor="middle" fill="white" font-family="sans-serif" font-size="36" font-weight="bold">+30</text>
  <text x="960" y="295" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="13">años</text>

  <!-- Cards section -->
  <rect x="60" y="384" width="1080" height="100" fill="#0d1e3d" opacity="0.8"/>

  <!-- Card 1 -->
  <rect x="90" y="400" width="230" height="70" rx="8" fill="#0a1628" stroke="#0047AB" stroke-width="1"/>
  <text x="116" y="428" fill="#0047AB" font-family="sans-serif" font-size="22" font-weight="bold">12</text>
  <text x="148" y="428" fill="white" font-family="sans-serif" font-size="13">Carreras</text>
  <text x="116" y="452" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">Técnicas y universitarias</text>

  <!-- Card 2 -->
  <rect x="340" y="400" width="230" height="70" rx="8" fill="#0a1628" stroke="#0047AB" stroke-width="1"/>
  <text x="366" y="428" fill="#2ecc71" font-family="sans-serif" font-size="22" font-weight="bold">500+</text>
  <text x="450" y="428" fill="white" font-family="sans-serif" font-size="13">Alumnos</text>
  <text x="366" y="452" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">Activos por año</text>

  <!-- Card 3 -->
  <rect x="590" y="400" width="230" height="70" rx="8" fill="#0a1628" stroke="#0047AB" stroke-width="1"/>
  <text x="616" y="428" fill="#f39c12" font-family="sans-serif" font-size="22" font-weight="bold">98%</text>
  <text x="670" y="428" fill="white" font-family="sans-serif" font-size="13">Egresados</text>
  <text x="616" y="452" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">Con inserción laboral</text>

  <!-- Card 4 -->
  <rect x="840" y="400" width="270" height="70" rx="8" fill="#0a1628" stroke="#0047AB" stroke-width="1"/>
  <text x="866" y="428" fill="#9b59b6" font-family="sans-serif" font-size="22" font-weight="bold">100%</text>
  <text x="948" y="428" fill="white" font-family="sans-serif" font-size="13">Online</text>
  <text x="866" y="452" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">Portal de gestión digital</text>

  <!-- Footer bar -->
  <rect x="0" y="548" width="1200" height="52" fill="#0a1628" opacity="0.85"/>
  <text x="60" y="580" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">Sitio Web Instituto Privado Tucumán</text>
  <text x="1140" y="580" text-anchor="end" fill="#0047AB" font-family="sans-serif" font-size="14">HTML · CSS · JavaScript · Responsive</text>
</svg>
