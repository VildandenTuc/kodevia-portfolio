  <text x="530" y="260" fill="#c792ea" font-family="monospace" font-size="13">  public </text>
  <text x="605" y="260" fill="#82aaff" font-family="monospace" font-size="13">List&lt;Libro&gt; </text>
  <text x="714" y="260" fill="#ffffff" font-family="monospace" font-size="13">buscarPorTitulo(</text>
  <text x="867" y="260" fill="#82aaff" font-family="monospace" font-size="13">String </text>
  <text x="916" y="260" fill="#ffffff" font-family="monospace" font-size="13">q) {</text>

  <text x="506" y="280" fill="#6a9fd8" font-family="monospace" font-size="13">8  </text>
  <text x="530" y="280" fill="#c792ea" font-family="monospace" font-size="13">    return </text>
  <text x="611" y="280" fill="#ffffff" font-family="monospace" font-size="13">libroRepo</text>
  <text x="700" y="280" fill="#82aaff" font-family="monospace" font-size="13">.findByTituloContaining(q);</text>

