  <text x="530" y="340" fill="#c792ea" font-family="monospace" font-size="13">  public </text>
  <text x="605" y="340" fill="#82aaff" font-family="monospace" font-size="13">Prestamo </text>
  <text x="685" y="340" fill="#ffffff" font-family="monospace" font-size="13">registrarPrestamo(</text>
  <text x="860" y="340" fill="#82aaff" font-family="monospace" font-size="13">Long </text>
  <text x="900" y="340" fill="#ffffff" font-family="monospace" font-size="13">id) {</text>

