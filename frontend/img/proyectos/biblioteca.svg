  <text x="530" y="360" fill="#82aaff" font-family="monospace" font-size="13">    Libro </text>
  <text x="592" y="360" fill="#ffffff" font-family="monospace" font-size="13">libro = libroRepo</text>
  <text x="728" y="360" fill="#82aaff" font-family="monospace" font-size="13">.findById(id)</text>

  <text x="506" y="380" fill="#6a9fd8" font-family="monospace" font-size="13">13 </text>
  <text x="530" y="380" fill="#ffffff" font-family="monospace" font-size="13">                   .</text>
  <text x="549" y="380" fill="#82aaff" font-family="monospace" font-size="13">orElseThrow(</text>
  <text x="668" y="380" fill="#ffffff" font-family="monospace" font-size="13">() -&gt; </text>
  <text x="706" y="380" fill="#c792ea" font-family="monospace" font-size="13">new </text>
  <text x="734" y="380" fill="#82aaff" font-family="monospace" font-size="13">NotFoundException());</text>

