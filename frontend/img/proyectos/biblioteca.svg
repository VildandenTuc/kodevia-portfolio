  <text x="530" y="400" fill="#4fc1ff" font-family="monospace" font-size="13">    // validar disponibilidad y registrar</text>

  <text x="506" y="420" fill="#6a9fd8" font-family="monospace" font-size="13">15 </text>
  <text x="530" y="420" fill="#ffffff" font-family="monospace" font-size="13">    libro.setPrestado(</text>
  <text x="693" y="420" fill="#f78c6c" font-family="monospace" font-size="13">true</text>
  <text x="726" y="420" fill="#ffffff" font-family="monospace" font-size="13">);</text>

  <text x="506" y="440" fill="#6a9fd8" font-family="monospace" font-size="13">16 </text>
  <text x="530" y="440" fill="#c792ea" font-family="monospace" font-size="13">    return </text>
  <text x="608" y="440" fill="#ffffff" font-family="monospace" font-size="13">prestamoRepo.save(</text>
  <text x="754" y="440" fill="#c792ea" font-family="monospace" font-size="13">new </text>
  <text x="782" y="440" fill="#82aaff" font-family="monospace" font-size="13">Prestamo(libro));</text>

