<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a1a"/>
      <stop offset="100%" style="stop-color:#0d2b0d"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a2d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e3e1e;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid pattern subtle -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6DB33F" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="680" cy="80" r="120" fill="#6DB33F" opacity="0.06"/>
  <circle cx="120" cy="380" r="90" fill="#6DB33F" opacity="0.06"/>

  <!-- Spring Boot leaf logo (simplified) -->
  <g transform="translate(60, 40)" filter="url(#glow)">
    <circle cx="40" cy="40" r="38" fill="#6DB33F" opacity="0.9"/>
    <ellipse cx="40" cy="40" rx="16" ry="26" fill="white" opacity="0.95" transform="rotate(-30,40,40)"/>
    <ellipse cx="40" cy="40" rx="8" ry="18" fill="#6DB33F" opacity="0.85" transform="rotate(-30,40,40)"/>
    <circle cx="40" cy="40" r="7" fill="white"/>
  </g>

  <!-- "Spring Boot" label -->
  <text x="120" y="65" font-family="'Courier New', monospace" font-size="13" fill="#6DB33F" opacity="0.9">Spring Boot</text>

  <!-- Architecture diagram - 3 layers -->
  <g transform="translate(60, 140)">
    <!-- Controller layer -->
    <rect x="0" y="0" width="200" height="52" rx="8" fill="url(#cardGrad)" stroke="#6DB33F" stroke-width="1.5" opacity="0.9"/>
    <text x="100" y="20" font-family="'Courier New', monospace" font-size="11" fill="#6DB33F" text-anchor="middle" opacity="0.7">@RestController</text>
    <text x="100" y="38" font-family="'Courier New', monospace" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Controller Layer</text>

    <!-- Arrow -->
    <line x1="100" y1="52" x2="100" y2="72" stroke="#6DB33F" stroke-width="2" opacity="0.6"/>
    <polygon points="100,78 94,68 106,68" fill="#6DB33F" opacity="0.6"/>

    <!-- Service layer -->
    <rect x="0" y="78" width="200" height="52" rx="8" fill="url(#cardGrad)" stroke="#6DB33F" stroke-width="1.5" opacity="0.9"/>
    <text x="100" y="98" font-family="'Courier New', monospace" font-size="11" fill="#6DB33F" text-anchor="middle" opacity="0.7">@Service</text>
    <text x="100" y="116" font-family="'Courier New', monospace" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Service Layer</text>

    <!-- Arrow -->
    <line x1="100" y1="130" x2="100" y2="150" stroke="#6DB33F" stroke-width="2" opacity="0.6"/>
    <polygon points="100,156 94,146 106,146" fill="#6DB33F" opacity="0.6"/>

    <!-- Repository layer -->
    <rect x="0" y="156" width="200" height="52" rx="8" fill="url(#cardGrad)" stroke="#6DB33F" stroke-width="1.5" opacity="0.9"/>
    <text x="100" y="176" font-family="'Courier New', monospace" font-size="11" fill="#6DB33F" text-anchor="middle" opacity="0.7">@Repository</text>
    <text x="100" y="194" font-family="'Courier New', monospace" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Repository Layer</text>
  </g>

  <!-- Code snippet right side -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="420" height="260" rx="10" fill="#0a1a0a" stroke="#6DB33F" stroke-width="1" opacity="0.8"/>
    <!-- Window dots -->
    <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="6" fill="#27c93f"/>
    <line x1="0" y1="34" x2="420" y2="34" stroke="#6DB33F" stroke-width="0.5" opacity="0.4"/>

    <text x="20" y="60" font-family="'Courier New', monospace" font-size="12" fill="#6DB33F">@RestController</text>
    <text x="20" y="80" font-family="'Courier New', monospace" font-size="12" fill="#6DB33F">@RequestMapping("/api")</text>
    <text x="20" y="100" font-family="'Courier New', monospace" font-size="12" fill="white">public class <tspan fill="#66d9e8">UserController</tspan> {</text>
    <text x="20" y="125" font-family="'Courier New', monospace" font-size="12" fill="#6DB33F">  @Autowired</text>
    <text x="20" y="145" font-family="'Courier New', monospace" font-size="12" fill="white">  private <tspan fill="#66d9e8">UserService</tspan> userService;</text>
    <text x="20" y="170" font-family="'Courier New', monospace" font-size="12" fill="#6DB33F">  @GetMapping("/users")</text>
    <text x="20" y="190" font-family="'Courier New', monospace" font-size="12" fill="white">  public <tspan fill="#66d9e8">List</tspan>&lt;<tspan fill="#66d9e8">User</tspan>&gt; getAll() {</text>
    <text x="20" y="210" font-family="'Courier New', monospace" font-size="12" fill="white">    return <tspan fill="#ffcc00">userService</tspan>.findAll();</text>
    <text x="20" y="230" font-family="'Courier New', monospace" font-size="12" fill="white">  }</text>
    <text x="20" y="250" font-family="'Courier New', monospace" font-size="12" fill="white">}</text>
  </g>

  <!-- Title at bottom -->
  <rect x="0" y="370" width="800" height="80" fill="#0d2b0d" opacity="0.8"/>
  <text x="60" y="405" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="bold">Arquitectura de Capas en Spring Boot</text>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="14" fill="#6DB33F" opacity="0.85">Del Caos al Orden · Kodevia Blog</text>

  <!-- Tags -->
  <rect x="640" y="385" width="100" height="24" rx="12" fill="#6DB33F" opacity="0.2" stroke="#6DB33F" stroke-width="1"/>
  <text x="690" y="401" font-family="Arial, sans-serif" font-size="11" fill="#6DB33F" text-anchor="middle">Arquitectura</text>
  <rect x="640" y="414" width="110" height="24" rx="12" fill="#6DB33F" opacity="0.2" stroke="#6DB33F" stroke-width="1"/>
  <text x="695" y="430" font-family="Arial, sans-serif" font-size="11" fill="#6DB33F" text-anchor="middle">Best Practices</text>
</svg>
